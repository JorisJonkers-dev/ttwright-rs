name: Bug
description: Something in the toolbox does not work as described.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Version or commit you ran.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, Windows, macOS]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with paths and personal data removed. No game files.
