# Keeps the `upstream` branch an exact copy of SulfurNitride/TTW_Linux_Installer `main` and opens one tracking
# issue listing upstream commits that have not been ported yet (FORK.md). It never runs upstream code: it only
# fetches and fast-forwards a branch. Scheduled runs fire late and irregularly in this estate, which is fine for
# porting; run it by hand (Actions, Run workflow) when a port is due.
name: Upstream sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: upstream
          fetch-depth: 0

      - name: Fast-forward upstream branch
        id: ff
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/SulfurNitride/TTW_Linux_Installer.git main
          before="$(git rev-parse HEAD)"
          after="$(git rev-parse FETCH_HEAD)"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --ff-only FETCH_HEAD
          git push origin HEAD:upstream
          {
            echo "Upstream \`main\` moved from \`${before}\` to \`${after}\`. Port what applies to \`main\` (FORK.md)."
            echo
            git log --no-merges --format='- [ ] %h %s' "${before}..${after}"
          } > "$RUNNER_TEMP/body.md"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open tracking issue
        if: ${{ steps.ff.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "Port upstream changes ($(date -u +%F))" --body-file "$RUNNER_TEMP/body.md"
