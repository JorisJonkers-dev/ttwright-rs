# One pipeline ending in "Pipeline Complete", the only required check (estate convention). The checks are steps of
# that one job; the quarantine check is a reusable workflow, so it is its own job and the last step gates on it.
# The Linux, Windows and macOS matrix arrives with the rewrite (see FORK.md); until then this builds on Linux.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  quarantine:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/quarantine-check.yml@b14d5e031f1abd5bec45e50c898e9e73f3ffc534 # v0.50.4

  pipeline-complete:
    name: Pipeline Complete
    needs: [quarantine]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check

      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --locked

      - name: Download actionlint
        id: actionlint
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          bash <(curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Lint GitHub Actions workflows
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          "${{ steps.actionlint.outputs.executable }}" -color .github/workflows/*.yml

      - name: Quarantine check passed
        if: ${{ !cancelled() }}
        run: test "${{ needs.quarantine.result }}" = success
