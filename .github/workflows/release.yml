# release-please keeps a release pull request open; merging it tags vX.Y.Z, writes CHANGELOG.md and bumps the
# version in Cargo.toml and package.nix (release-please-config.json). Nothing is published to a registry. Each
# release gets the ttwright binaries for Linux x86_64, Windows x86_64 and macOS (universal), the Contract schemas
# and SHA256SUMS as assets, with a build provenance attestation over all of them (scripts/release-assets.sh). Then
# the Toolbox is told, so its Component bump workflow opens the pull request that pins the new tag.
# `workflow_dispatch` is the dry run: it builds and attests the same assets from the selected ref and keeps them as
# a workflow artifact; it creates no release and tells no one. With `tag` and `publish` it republishes that existing tag
# (assets and packages) and still tells no one.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag, vX.Y.Z. Empty runs the dry run from the selected ref
        required: false
        type: string
      publish:
        description: Publish the tag's assets and package (false is a dry run)
        required: false
        default: false
        type: boolean

# Each job asks for what it needs; the workflow itself holds nothing.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Author the release PR with the release App token (not the default GITHUB_TOKEN) so CI runs on the PR
      # without a manual approval gate. Best-effort: falls back to GITHUB_TOKEN when the App secrets are absent.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please cannot edit Cargo.lock, so the release PR would fail every `--locked` build. Refresh the
      # workspace crates' own lock entries on the release branch, with the App token so that CI runs on the commit.
      # The open release PR is looked up by its label: release-please reports `pr` only when it changed the PR.
      - name: Find the release pull request
        id: release-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.rp.outputs.pr }}
        run: |
          set -euo pipefail
          # release-please reports the pull request it opened or changed in `pr`; use that first. The label
          # lookup is the fallback, retried, because the label is added after the pull request is opened.
          branch=""
          if [[ -n $RELEASE_PR ]]; then
            branch="$(jq -r '.headBranchName // ""' <<<"$RELEASE_PR")"
          fi
          for _ in 1 2 3 4 5 6; do
            [[ -n $branch ]] && break
            branch="$(gh pr list --repo "$REPO" --state open --label 'autorelease: pending' --json headRefName --jq '.[0].headRefName // ""')"
            [[ -n $branch ]] || sleep 10
          done
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          echo "release pull request branch: ${branch:-none}"
      - if: ${{ steps.release-pr.outputs.branch != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          persist-credentials: false
      - if: ${{ steps.release-pr.outputs.branch != '' }}
        name: Refresh the lock entries of the workspace crates
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          set -euo pipefail
          cargo update --workspace
          cargo update --workspace --manifest-path fuzz/Cargo.toml
          if git diff --quiet; then echo "the lock entries are current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): refresh the workspace lock entries"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"

  build:
    needs: release-please
    # After a release is created from main, or on demand for the dry run.
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') || github.event_name == 'workflow_dispatch') }}
    name: Build (${{ matrix.asset }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            asset: ttwright-x86_64-unknown-linux-gnu
          - os: windows-latest
            asset: ttwright-x86_64-pc-windows-msvc.exe
          - os: macos-latest
            asset: ttwright-universal-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false
      - name: Build
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "$ASSET" in
            *apple-darwin)
              rustup target add x86_64-apple-darwin aarch64-apple-darwin
              cargo build --release --locked -p ttwright-cli --target x86_64-apple-darwin
              cargo build --release --locked -p ttwright-cli --target aarch64-apple-darwin
              lipo -create -output "dist/$ASSET" \
                target/x86_64-apple-darwin/release/ttwright target/aarch64-apple-darwin/release/ttwright
              lipo -info "dist/$ASSET"
              ;;
            *.exe)
              cargo build --release --locked -p ttwright-cli
              cp target/release/ttwright.exe "dist/$ASSET"
              ;;
            *)
              cargo build --release --locked -p ttwright-cli
              cp target/release/ttwright "dist/$ASSET"
              ;;
          esac
      - name: Smoke test
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          chmod +x "dist/$ASSET" || true
          "dist/$ASSET" --version
          "dist/$ASSET" contracts --json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  assets:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: binaries
          merge-multiple: true
      - name: Gather the assets
        run: scripts/release-assets.sh binaries dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload to the release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Keep the assets of a dry run
        if: ${{ github.event_name == 'workflow_dispatch' && !(inputs.tag != '' && inputs.publish) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-dry-run
          path: dist/
          retention-days: 7

  packages:
    needs: [release-please, assets]
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.publish)) && needs.assets.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: binaries
          merge-multiple: true
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      - name: Build archives
        env:
          BINARIES: binaries
          OUT: packages
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          tar -czf "$OUT/ttwright-x86_64-unknown-linux-gnu.tar.gz" -C "$BINARIES" ttwright-x86_64-unknown-linux-gnu -C "$WORKSPACE" LICENSE
          stage="$OUT/stage-windows"
          mkdir -p "$stage"
          cp "$BINARIES/ttwright-x86_64-pc-windows-msvc.exe" "$stage/"
          cp "$WORKSPACE/LICENSE" "$stage/"
          (cd "$stage" && zip -r "$WORKSPACE/$OUT/ttwright-x86_64-pc-windows-msvc.zip" .)
          stage="$OUT/stage-macos"
          mkdir -p "$stage"
          cp "$BINARIES/ttwright-universal-apple-darwin" "$stage/"
          cp "$WORKSPACE/LICENSE" "$stage/"
          tar -czf "$OUT/ttwright-universal-apple-darwin.tar.gz" -C "$stage" .
          rm -rf "$OUT/stage-windows" "$OUT/stage-macos"
          tar -tzf "$OUT/ttwright-x86_64-unknown-linux-gnu.tar.gz" >/dev/null
          unzip -t "$OUT/ttwright-x86_64-pc-windows-msvc.zip" >/dev/null
          tar -tzf "$OUT/ttwright-universal-apple-darwin.tar.gz" >/dev/null
          ls -l "$OUT"
      - name: Push packages
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          OUT: packages
        run: |
          set -euo pipefail
          # The commit the tag points at (the job checked the tag out), also when the workflow runs from main.
          REVISION="$(git rev-parse HEAD)"
          VERSION="${TAG_NAME#v}"
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          push_one() {
            local target="$1" archive="$2"
            local ref="ghcr.io/jorisjonkers-dev/ttwright-rs:${VERSION}-${target}"
            (cd "$OUT" && oras push "$ref" "$(basename "$archive")" \
              --annotation "org.opencontainers.image.source=https://github.com/JorisJonkers-dev/ttwright-rs" \
              --annotation "org.opencontainers.image.revision=${REVISION}" \
              --annotation "org.opencontainers.image.licenses=GPL-3.0-only")
            local digest
            digest="$(oras resolve "$ref")"
            printf '%s' "$digest" > "$OUT/${target}.digest"
            sha256sum "$archive" | awk '{print $1}' > "$OUT/${target}.sha256"
            echo "pushed $ref $digest"
          }

          push_one x86_64-unknown-linux-gnu "$OUT/ttwright-x86_64-unknown-linux-gnu.tar.gz"
          push_one x86_64-pc-windows-msvc "$OUT/ttwright-x86_64-pc-windows-msvc.zip"
          push_one universal-apple-darwin "$OUT/ttwright-universal-apple-darwin.tar.gz"

          {
            echo "digest_linux=$(cat "$OUT/x86_64-unknown-linux-gnu.digest")"
            echo "digest_windows=$(cat "$OUT/x86_64-pc-windows-msvc.digest")"
            echo "digest_macos=$(cat "$OUT/universal-apple-darwin.digest")"
          } >> "$GITHUB_OUTPUT"
      - name: Attest Linux package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/jorisjonkers-dev/ttwright-rs
          subject-digest: ${{ steps.push.outputs.digest_linux }}
          push-to-registry: true
      - name: Attest Windows package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/jorisjonkers-dev/ttwright-rs
          subject-digest: ${{ steps.push.outputs.digest_windows }}
          push-to-registry: true
      - name: Attest macOS package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/jorisjonkers-dev/ttwright-rs
          subject-digest: ${{ steps.push.outputs.digest_macos }}
          push-to-registry: true
      # The attestations above push to the registry with the login of the push step; the pull below is anonymous.
      - name: Log out of the registry
        run: oras logout ghcr.io
      - name: Verify packages are public
        if: ${{ vars.TTWRIGHT_FIRST_PACKAGE_PUSH != 'true' }}
        env:
          OUT: packages
        run: |
          set -euo pipefail
          check() {
            local target="$1" archive="$2"
            local digest sha ref pulled
            digest="$(cat "$OUT/${target}.digest")"
            sha="$(cat "$OUT/${target}.sha256")"
            ref="ghcr.io/jorisjonkers-dev/ttwright-rs@${digest}"
            rm -rf "$OUT/pull-${target}"
            mkdir -p "$OUT/pull-${target}"
            oras pull "$ref" -o "$OUT/pull-${target}"
            pulled="$(sha256sum "$OUT/pull-${target}/$(basename "$archive")" | awk '{print $1}')"
            echo "$target: pulled $pulled (expected $sha)"
            test "$pulled" = "$sha"
          }
          check x86_64-unknown-linux-gnu "$OUT/ttwright-x86_64-unknown-linux-gnu.tar.gz"
          check x86_64-pc-windows-msvc "$OUT/ttwright-x86_64-pc-windows-msvc.zip"
          check universal-apple-darwin "$OUT/ttwright-universal-apple-darwin.tar.gz"
      - name: Record package references
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          OUT: packages
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          summary="$(mktemp)"
          {
            echo "## OCI packages"
            echo
            echo "| Name | Tag | Digest | Archive SHA-256 |"
            echo "| --- | --- | --- | --- |"
            echo "| ghcr.io/jorisjonkers-dev/ttwright-rs | ${VERSION}-x86_64-unknown-linux-gnu | $(cat "$OUT/x86_64-unknown-linux-gnu.digest") | $(cat "$OUT/x86_64-unknown-linux-gnu.sha256") |"
            echo "| ghcr.io/jorisjonkers-dev/ttwright-rs | ${VERSION}-x86_64-pc-windows-msvc | $(cat "$OUT/x86_64-pc-windows-msvc.digest") | $(cat "$OUT/x86_64-pc-windows-msvc.sha256") |"
            echo "| ghcr.io/jorisjonkers-dev/ttwright-rs | ${VERSION}-universal-apple-darwin | $(cat "$OUT/universal-apple-darwin.digest") | $(cat "$OUT/universal-apple-darwin.sha256") |"
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          existing="$(gh release view "$TAG_NAME" --json body -q .body)"
          notes="$(mktemp)"
          printf '%s\n' "$existing" > "$notes"
          printf '\n## Packages\n\n' >> "$notes"
          cat "$summary" >> "$notes"
          gh release edit "$TAG_NAME" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"

  # The Toolbox's component-bump.yml opens the pull request that moves its ttwright-rs pin to the new tag.
  toolbox:
    needs: [release-please, assets]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.assets.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: rauls-trusty-toolbox
          permission-contents: write
      - name: Tell the Toolbox
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api repos/JorisJonkers-dev/rauls-trusty-toolbox/dispatches \
            -f event_type=component-release -f 'client_payload[component]=ttwright-rs' -f "client_payload[tag]=$TAG"

  packages-dry-run:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Linux binary
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo build --release --locked -p ttwright-cli
          cp target/release/ttwright dist/ttwright-x86_64-unknown-linux-gnu
      - name: Create archive
        env:
          OUT: packages
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          tar -czf "$OUT/ttwright-x86_64-unknown-linux-gnu.tar.gz" -C dist ttwright-x86_64-unknown-linux-gnu -C "$WORKSPACE" LICENSE
          tar -tzf "$OUT/ttwright-x86_64-unknown-linux-gnu.tar.gz" >/dev/null
          sha256sum "$OUT/ttwright-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}' > "$OUT/sha256"
      - name: Print what would be pushed
        env:
          OUT: packages
          VERSION: 0.0.0-dry-run
        run: |
          set -euo pipefail
          SHA="$(cat "$OUT/sha256")"
          echo "Would push: ghcr.io/jorisjonkers-dev/ttwright-rs:${VERSION}-x86_64-unknown-linux-gnu"
          echo "Archive SHA-256: $SHA"
