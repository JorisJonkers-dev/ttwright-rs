# The RustSec database against the lockfiles every day: a new advisory against an unchanged lockfile is the common
# case, and a failed run is the alert. Pull requests are covered by Pipeline Complete.
name: Security

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  advisories:
    name: RustSec advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: true
      - run: |
          mise exec -- cargo deny --locked check advisories
          mise exec -- cargo deny --locked --manifest-path fuzz/Cargo.toml check advisories
          mise exec -- cargo audit
