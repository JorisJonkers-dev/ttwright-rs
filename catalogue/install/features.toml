[group]
id = "install.features"
title = "MPI manifest features"
origin = "original"
notes = "The manifest features of the MPI installer format (the TTW installer's package format) that an install supports, by the ids an unsupported_feature error names. ttwright contracts --json lists them (crates/ttwright-contract/src/supports.rs); a manifest that uses any other is refused."

[[item]]
id = "manifest_field_package"
title = "`manifest_field:Package`: package title, version and author"
status = "implemented"

[[item]]
id = "manifest_field_variables"
title = "`manifest_field:Variables`: variables per profile"
status = "implemented"

[[item]]
id = "manifest_field_locations"
title = "`manifest_field:Locations`: locations per profile"
status = "implemented"

[[item]]
id = "manifest_field_tags"
title = "`manifest_field:Tags`: asset tags (informational)"
status = "implemented"

[[item]]
id = "manifest_field_assets"
title = "`manifest_field:Assets`: asset operations"
status = "implemented"

[[item]]
id = "manifest_field_checks"
title = "`manifest_field:Checks`: pre-installation checks"
status = "implemented"

[[item]]
id = "manifest_field_fileattrs"
title = "`manifest_field:FileAttrs`: modification times set after the install"
status = "implemented"

[[item]]
id = "manifest_field_postcommands"
title = "`manifest_field:PostCommands`: post-installation commands"
status = "implemented"

[[item]]
id = "asset_op_0"
title = "`asset_op:0`: copy a file from a game folder or archive"
status = "implemented"

[[item]]
id = "asset_op_1"
title = "`asset_op:1`: a new file from the package"
status = "implemented"

[[item]]
id = "asset_op_2"
title = "`asset_op:2`: a VCDIFF (xdelta3) patch of a game file"
status = "implemented"

[[item]]
id = "asset_op_4"
title = "`asset_op:4`: resample Ogg Vorbis audio (OggEnc2)"
status = "implemented"

[[item]]
id = "asset_op_5"
title = "`asset_op:5`: decode and encode audio to Ogg Vorbis, WAV or MP3"
status = "implemented"

[[item]]
id = "audio_param__f"
title = "`audio_param:-f`: target sample rate in Hz"
status = "implemented"

[[item]]
id = "audio_param__q"
title = "`audio_param:-q`: Ogg Vorbis quality, 0 to 10"
status = "implemented"

[[item]]
id = "audio_param__c"
title = "`audio_param:-c`: output channel count, 1 or 2 (mono and stereo convert into each other)"
status = "implemented"

[[item]]
id = "audio_param__fmt"
title = "`audio_param:-fmt`: output format (ogg, wav or mp3), checked against the target file's extension"
status = "implemented"

[[item]]
id = "audio_param__b"
title = "`audio_param:-b`: MP3 bit rate in kbit/s (8 to 320, the LAME rates)"
status = "implemented"

[[item]]
id = "audio_format_ogg"
title = "`audio_format:ogg`: Ogg Vorbis output"
status = "implemented"

[[item]]
id = "audio_format_wav"
title = "`audio_format:wav`: WAV output"
status = "implemented"

[[item]]
id = "audio_format_mp3"
title = "`audio_format:mp3`: MP3 output (LAME)"
status = "implemented"

[[item]]
id = "location_type_0"
title = "`location_type:0`: a folder"
status = "implemented"

[[item]]
id = "location_type_1"
title = "`location_type:1`: an archive (BSA) read from"
status = "implemented"

[[item]]
id = "location_type_2"
title = "`location_type:2`: an archive (BSA) written to"
status = "implemented"

[[item]]
id = "variable_type_0"
title = "`variable_type:0`: a string, may name other variables"
status = "implemented"

[[item]]
id = "variable_type_4"
title = "`variable_type:4`: a registry path, replaced by the game copy given on the command line"
status = "implemented"

[[item]]
id = "variable__destination_"
title = "`variable:%DESTINATION%`: the destination folder"
status = "implemented"

[[item]]
id = "variable__fo3root_"
title = "`variable:%FO3ROOT%`: the Fallout 3 copy (also %FO3DATA%, %FALLOUT3ROOT%, %FALLOUT3DATA%)"
status = "implemented"

[[item]]
id = "variable__fnvroot_"
title = "`variable:%FNVROOT%`: the Fallout: New Vegas copy (also %FNVDATA%, %FALLOUTNVROOT%, %FALLOUTNVDATA%)"
status = "implemented"

[[item]]
id = "variable__tes4root_"
title = "`variable:%TES4ROOT%`: the Oblivion copy (also %TES4DATA%, %OBLIVIONROOT%, %OBLIVIONDATA%)"
status = "implemented"

[[item]]
id = "check_type_0"
title = "`check_type:0`: a file exists, or matches an MD5, SHA-1 or CRC32 checksum"
status = "implemented"

[[item]]
id = "check_type_1"
title = "`check_type:1`: free space at a location"
status = "implemented"

[[item]]
id = "check_type_2"
title = "`check_type:2`: the destination is not under Program Files"
status = "implemented"

[[item]]
id = "post_command_del"
title = "`post_command:del`: delete a file in the destination"
status = "implemented"

[[item]]
id = "post_command_ren"
title = "`post_command:ren`: rename a file in the destination"
status = "implemented"
