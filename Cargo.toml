[workspace]
resolver = "3"
members = [
    "crates/ttwright-core",
    "crates/ttwright-cli",
    "crates/ttwright-contract",
    "crates/ttwright-testkit",
    "crates/xtask",
]
# fuzz/ and tools/coverage-gate are their own workspaces (libfuzzer-sys and the gate stay out of the shipped crates).
exclude = ["fuzz", "tools"]

[workspace.package]
version = "0.4.4"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
authors = ["Sulfur Nitride", "Joris Jonkers"]
repository = "https://github.com/JorisJonkers-dev/ttwright-rs"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
ttwright-core = { path = "crates/ttwright-core" }
ttwright-contract = { path = "crates/ttwright-contract" }
ttwright-testkit = { path = "crates/ttwright-testkit" }

anyhow = "1.0.104"
ba2 = "3.0.1"
time = { version = "0.3.47", default-features = false, features = ["std", "parsing", "formatting", "local-offset", "macros"] }
clap = { version = "4.6.1", features = ["derive"] }
crossbeam-channel = "0.5.15"
ctrlc = "3.5.2"
dirs = "6.0.0"
hex = "0.4.3"
hound = "3.5.1"
indicatif = "0.18.4"
libc = "0.2.186"
lz4_flex = "0.14.0"
md-5 = "0.11.0"
mp3lame-encoder = "0.3.0"
oxidelta = { version = "0.1.4", default-features = false, features = ["zlib-secondary"] }
rayon = "1.12.0"
rubato = "0.16.2"
rusqlite = { version = "0.42.0", features = ["bundled"] }
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.11.0"
symphonia = { version = "0.5.5", features = ["ogg", "wav", "pcm", "vorbis", "mp3"] }
sysinfo = "0.39.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
vorbis_rs = "0.5.5"
walkdir = "2.5.0"
