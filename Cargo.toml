[workspace]
resolver = "3"
members = [
    "crates/ttwright-core",
    "crates/ttwright-cli",
    "crates/ttwright-contract",
    "crates/ttwright-testkit",
]
# fuzz/ and tools/coverage-gate are their own workspaces (libfuzzer-sys and the gate stay out of the shipped crates).
exclude = ["fuzz", "tools"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
authors = ["Sulfur Nitride", "Joris Jonkers"]
repository = "https://github.com/JorisJonkers-dev/ttwright-rs"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
ttwright-core = { path = "crates/ttwright-core" }
ttwright-contract = { path = "crates/ttwright-contract" }
ttwright-testkit = { path = "crates/ttwright-testkit" }

anyhow = "1.0"
ba2 = "3.0.1"
chrono = "0.4"
clap = { version = "4.0", features = ["derive"] }
crossbeam-channel = "0.5"
ctrlc = "3.4"
dirs = "6.0"
hex = "0.4"
hound = "3.5"
indicatif = "0.18"
libc = "0.2"
lz4_flex = "0.13"
md-5 = "0.10"
mp3lame-encoder = "0.2"
oxidelta = { version = "0.1", default-features = false, features = ["zlib-secondary"] }
rayon = "1.10"
rubato = "0.16"
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = { version = "1.2.1", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
symphonia = { version = "0.5", features = ["ogg", "wav", "pcm", "vorbis", "mp3"] }
sysinfo = "0.39"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
vorbis_rs = "0.5"
walkdir = "2.5"
