<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150" role="img" aria-label="ttwright-rs builds Tale of Two Wastelands from your own Fallout 3 and New Vegas and the TTW package, and raul adds it as one Mod">
<title>ttwright-rs builds Tale of Two Wastelands from your own Fallout 3 and New Vegas and the TTW package, and raul adds it as one Mod</title>
<rect width="800" height="150" rx="12" fill="#101215"/>
<rect x="20.0" y="20" width="226.7" height="88" rx="10" fill="#171A1F" stroke="#2F353F" stroke-width="1.5"/>
<text x="133.33333333333331" y="47" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3DD6C6" font-weight="bold" text-anchor="middle">Your two games</text>
<text x="133.33333333333331" y="71" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E6E8EB" font-weight="normal" text-anchor="middle">Fallout 3 and New Vegas</text>
<text x="133.33333333333331" y="91" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#98A1AC" font-weight="normal" text-anchor="middle">plus the TTW download</text>
<path d="M252.7 64 h24" stroke="#3DD6C6" stroke-width="2.5"/>
<path d="M276.7 58 l8 6 l-8 6 z" fill="#3DD6C6"/>
<rect x="286.7" y="20" width="226.7" height="88" rx="10" fill="#171A1F" stroke="#F59E3B" stroke-width="2"/>
<text x="399.99999999999994" y="47" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F59E3B" font-weight="bold" text-anchor="middle">ttwright-rs</text>
<text x="399.99999999999994" y="71" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E6E8EB" font-weight="normal" text-anchor="middle">builds TTW from them</text>
<text x="399.99999999999994" y="91" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#98A1AC" font-weight="normal" text-anchor="middle">stop and continue later</text>
<path d="M519.3 64 h24" stroke="#3DD6C6" stroke-width="2.5"/>
<path d="M543.3 58 l8 6 l-8 6 z" fill="#3DD6C6"/>
<rect x="553.3" y="20" width="226.7" height="88" rx="10" fill="#171A1F" stroke="#2F353F" stroke-width="1.5"/>
<text x="666.6666666666666" y="47" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3DD6C6" font-weight="bold" text-anchor="middle">One Mod in raul</text>
<text x="666.6666666666666" y="71" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E6E8EB" font-weight="normal" text-anchor="middle">both worlds in one game</text>
<text x="666.6666666666666" y="91" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#98A1AC" font-weight="normal" text-anchor="middle">added to your mod list</text>
<text x="400" y="136" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#98A1AC" font-weight="normal" text-anchor="middle">Both games stay untouched: ttwright-rs writes only into its own output folder.</text>
</svg>
