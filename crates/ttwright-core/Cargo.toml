[package]
name = "ttwright-core"
description = "The TTW and MPI installer library: MPI packages, manifests, checks, asset operations, archives, resume."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ttwright-contract = { workspace = true }
anyhow = { workspace = true }
ba2 = { workspace = true }
chrono = { workspace = true }
crossbeam-channel = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
hound = { workspace = true }
indicatif = { workspace = true }
lz4_flex = { workspace = true }
md-5 = { workspace = true }
mp3lame-encoder = { workspace = true }
oxidelta = { workspace = true }
rayon = { workspace = true }
rubato = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
symphonia = { workspace = true }
sysinfo = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
vorbis_rs = { workspace = true }
walkdir = { workspace = true }
# Optional in-process FFmpeg audio backend for benchmarking.
ffmpeg-next = { version = "8.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
ttwright-testkit = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
ffmpeg-audio = ["dep:ffmpeg-next"]

# Only builds with the optional in-process FFmpeg backend enabled.
[[example]]
name = "bench_ffmpeg_lib_audio"
required-features = ["ffmpeg-audio"]

[lints]
workspace = true
