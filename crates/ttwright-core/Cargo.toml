[package]
name = "ttwright-core"
description = "The TTW and MPI installer library: MPI packages, manifests, checks, asset operations, archives, resume."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ttwright-contract = { workspace = true }
anyhow = { workspace = true }
ba2 = { workspace = true }
crossbeam-channel = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
hound = { workspace = true }
indicatif = { workspace = true }
lz4_flex = { workspace = true }
md-5 = { workspace = true }
mp3lame-encoder = { workspace = true }
oxidelta = { workspace = true }
rayon = { workspace = true }
rubato = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
symphonia = { workspace = true }
sysinfo = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
vorbis_rs = { workspace = true }
walkdir = { workspace = true }
# Optional in-process FFmpeg audio backend for benchmarking.
ffmpeg-next = { version = "8.1.0", optional = true }

# directxtex 1.3.0 (through ba2) passes `.object("Ole32.lib")` from its build script. cc 1.9 and newer resolve that
# to a path inside the crate folder and MSVC lib.exe fails with LNK1181 (checked on 1.10.0 and 1.11.1; cc 1.9.0 changed how objects reach the archiver, #2033). Keep cc below 1.9
# for every consumer until directxtex is fixed upstream; remove this bound once it is.
[target.'cfg(windows)'.dependencies]
cc = ">=1.2, <1.9"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
ttwright-testkit = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
ffmpeg-audio = ["dep:ffmpeg-next"]

# Only builds with the optional in-process FFmpeg backend enabled.
[[example]]
name = "bench_ffmpeg_lib_audio"
required-features = ["ffmpeg-audio"]

[lints]
workspace = true
